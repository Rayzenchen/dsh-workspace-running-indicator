name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dev dependencies
        run: npm ci
      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          node --check tools/verify.mjs
          node --check tools/test-client.mjs
      - name: Release checks
        run: node tools/verify.mjs
      - name: Behaviour tests
        run: node tools/test-client.mjs
