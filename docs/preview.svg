<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Folded workspace rows with a running spinner, and the expanded state">
  <!-- Folded state: two workspace rows, the first one running. -->
  <rect x="32" y="48" width="272" height="88" rx="14" fill="none" stroke="#b7c3d2" stroke-width="2"/>
  <g fill="#7cb7ff" fill-opacity="0.5">
    <path d="M56 82.2c0-1.5 1.2-2.7 2.7-2.7h5.1c.7 0 1.35.27 1.85.75l1.15 1.1c.5.48 1.15.75 1.85.75h8.6c1.5 0 2.7 1.2 2.7 2.7v13.6c0 1.5-1.2 2.7-2.7 2.7H58.7c-1.5 0-2.7-1.2-2.7-2.7V82.2Z"/>
  </g>
  <circle cx="82" cy="92" r="6.4" fill="none" stroke="#679efe" stroke-opacity="0.3" stroke-width="3"/>
  <circle cx="82" cy="92" r="6.4" fill="none" stroke="#679efe" stroke-width="3" stroke-linecap="round" stroke-dasharray="30 40" transform="rotate(-90 82 92)"/>
  <rect x="98" y="84" width="120" height="10" rx="5" fill="#8d9cb0"/>
  <rect x="98" y="102" width="64" height="8" rx="4" fill="#c3ccd8"/>

  <g fill="#7cb7ff" fill-opacity="0.5">
    <path d="M56 140.2c0-1.5 1.2-2.7 2.7-2.7h5.1c.7 0 1.35.27 1.85.75l1.15 1.1c.5.48 1.15.75 1.85.75h8.6c1.5 0 2.7 1.2 2.7 2.7v13.6c0 1.5-1.2 2.7-2.7 2.7H58.7c-1.5 0-2.7-1.2-2.7-2.7V140.2Z"/>
  </g>
  <rect x="76" y="142" width="120" height="10" rx="5" fill="#8d9cb0"/>
  <rect x="76" y="160" width="48" height="8" rx="4" fill="#c3ccd8"/>

  <!-- Expanded state: the same workspace, its sessions visible. -->
  <rect x="336" y="48" width="272" height="196" rx="14" fill="none" stroke="#b7c3d2" stroke-width="2"/>
  <g fill="#7cb7ff" fill-opacity="0.5">
    <path d="M360 70.2c0-1.5 1.2-2.7 2.7-2.7h5.1c.7 0 1.35.27 1.85.75l1.15 1.1c.5.48 1.15.75 1.85.75h8.6c1.5 0 2.7 1.2 2.7 2.7v13.6c0 1.5-1.2 2.7-2.7 2.7h-25.5c-1.5 0-2.7-1.2-2.7-2.7V70.2Z"/>
  </g>
  <rect x="384" y="72" width="132" height="10" rx="5" fill="#8d9cb0"/>
  <rect x="384" y="90" width="72" height="8" rx="4" fill="#c3ccd8"/>

  <rect x="352" y="118" width="240" height="34" rx="9" fill="#eef3fa"/>
  <circle cx="374" cy="135" r="6.4" fill="none" stroke="#679efe" stroke-opacity="0.3" stroke-width="3"/>
  <circle cx="374" cy="135" r="6.4" fill="none" stroke="#679efe" stroke-width="3" stroke-linecap="round" stroke-dasharray="30 40" transform="rotate(-90 374 135)"/>
  <rect x="392" y="130" width="150" height="10" rx="5" fill="#7d8ca1"/>

  <rect x="352" y="162" width="240" height="34" rx="9" fill="none"/>
  <rect x="392" y="174" width="112" height="10" rx="5" fill="#b3bfce"/>
  <rect x="352" y="206" width="240" height="34" rx="9" fill="none"/>
  <rect x="392" y="218" width="134" height="10" rx="5" fill="#b3bfce"/>

  <!-- Direction between the two states. -->
  <path d="M312 146h16m-5-5 5 5-5 5" fill="none" stroke="#8d9cb0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
